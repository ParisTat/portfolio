version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Types must match the Node version CI runs (see the workflows); bump both together by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Hold ESLint at 9 until eslint-plugin-jsx-a11y supports ESLint 10 (its peer range ends at ^9).
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # Hold TypeScript below 7 until typescript-eslint supports it (its peer range ends <6.1.0).
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      # Packages that must move in lockstep get one PR each, including major bumps.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      eslint:
        patterns: ["eslint", "@eslint/*", "typescript-eslint", "eslint-plugin-*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      # Everything else: minor and patch updates batched into one PR.
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
